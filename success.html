<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Success</title>

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#00c853,#64dd17);
    font-family:Arial, Helvetica, sans-serif;
}

.card{
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    width:400px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.circle{
    width:100px;
    height:100px;
    background:#00c853;
    border-radius:50%;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:50px;
}

h1{
    color:#00c853;
    margin-top:20px;
}

p{
    color:#666;
    font-size:18px;
}

a{
    display:inline-block;
    margin-top:20px;
    text-decoration:none;
    background:#2575fc;
    color:white;
    padding:12px 25px;
    border-radius:8px;
    transition:.3s;
}

a:hover{
    background:#174db8;
}

</style>

</head>
<body>

<div class="card">

<div class="circle">
✔
</div>

<h1>Success!</h1>

<p>Your data has been submitted successfully.</p>

<a href="/">Submit Another Response</a>

</div>

</body>
</html>
